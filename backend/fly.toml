# Fly.io alternative to render.yaml. Same idea: deploy the backend,
# skip the LLM (or point OLLAMA_BASE_URL at a hosted Ollama).
#
# One-time setup:
#   flyctl launch --no-deploy --copy-config --name biomed-rag-backend
#   flyctl volumes create chroma_data --size 1 --region iad
#   flyctl secrets set NCBI_EMAIL=you@example.com
#   flyctl deploy

app = "biomed-rag-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_MODEL = "llama3.2:3b"
  EMBEDDING_MODEL = "sentence-transformers/all-MiniLM-L6-v2"
  CHROMA_PERSIST_DIR = "/data/chroma_db"
  CHROMA_COLLECTION = "pubmed_chunks"
  RAG_TOP_K = "6"

[[mounts]]
  source = "chroma_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      path = "/health"
      interval = "30s"
      timeout = "5s"
